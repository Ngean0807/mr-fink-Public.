name: Refresh from SEC EDGAR

# EDGAR has no push notifications, so the site polls it: every 5 minutes (GitHub's shortest
# schedule; runs can start a few minutes late under load) the pipeline re-reads
# the managers' and companies' filing indexes and market quotes, rebuilds only what changed
# (everything else comes from the cache) and redeploys. The page polls data/status.json and
# data/quotes.json and updates in place; with a Finnhub key it streams real-time trades.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test_notification:
        description: Send a test push to the phone
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read  # the alert job reads the previous run's result

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore EDGAR cache
        uses: actions/cache/restore@v4
        with:
          path: .cache
          key: edgar-${{ github.run_id }}
          restore-keys: edgar-
      - name: Unit tests
        run: python -m unittest discover -s tests -t .
      - name: Build data from EDGAR
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT || 'Mr Fink nissim711@gmail.com' }}
          MRFINK_SUBMISSIONS_TTL: "0"
          # Phone pushes via ntfy: the topic is a repository secret, never written to the site.
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TEST: ${{ inputs.test_notification }}
        run: python -m pipeline.build
      - name: Price feed config
        # Optional: a free Finnhub key turns on real-time prices (websocket trades) in the browser.
        # Without it the page shows Yahoo Finance quotes refreshed by this workflow.
        env:
          FINNHUB_KEY: ${{ vars.FINNHUB_KEY }}
        run: |
          python -c "import json, os; json.dump({'finnhubKey': os.environ.get('FINNHUB_KEY') or None}, open('web/data/config.json', 'w'))"
      - name: Decide whether to save the cache
        if: always()
        # Saving ~hundreds of MB every 5 minutes churns the 10 GB cache limit; once an hour is enough
        # (the notification state is published with the site, not kept only here).
        id: hourly
        # Runs come every 5 minutes from cron-job.org (workflow_dispatch) or GitHub's schedule; a
        # push to main (new code) always saves.
        run: echo "save=$([ "$(date -u +%M)" -lt 5 ] || [ "${{ github.event_name }}" = "push" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Save EDGAR cache
        # Also after a failed or timed-out build, so a slow first run (OpenFIGI mapping thousands of
        # new CUSIPs) is not repeated from scratch by every later run.
        if: always() && steps.hourly.outputs.save == 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache
          key: edgar-${{ github.run_id }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # A push to the owner's phone when a refresh fails after a good one, and when it recovers.
  # Without this a broken refresh only shows as a site that quietly stops updating.
  alert:
    needs: [build, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Compare with the previous run
        env:
          GH_TOKEN: ${{ github.token }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          BUILD: ${{ needs.build.result }}
          DEPLOY: ${{ needs.deploy.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$NTFY_TOPIC" ] || exit 0
          now=success
          { [ "$BUILD" = failure ] || [ "$DEPLOY" = failure ]; } && now=failure
          prev=$(gh api "repos/${{ github.repository }}/actions/workflows/refresh.yml/runs?per_page=10&status=completed" \
            --jq "[.workflow_runs[] | select(.id != ${{ github.run_id }}) | select(.conclusion == \"success\" or .conclusion == \"failure\")][0].conclusion")
          echo "this run: $now, previous: $prev"
          if [ "$now" = failure ] && [ "$prev" != failure ]; then
            curl -s -H "Title: Mr. Fink refresh failed" -H "Priority: high" -H "Tags: warning" -H "Click: $RUN_URL" \
              -d "The site stopped updating (build: $BUILD, deploy: $DEPLOY). Tap for the log." "https://ntfy.sh/$NTFY_TOPIC"
          elif [ "$now" = success ] && [ "$prev" = failure ]; then
            curl -s -H "Title: Mr. Fink refresh recovered" -H "Tags: white_check_mark" -H "Click: $RUN_URL" \
              -d "Updates are running again." "https://ntfy.sh/$NTFY_TOPIC"
          fi
