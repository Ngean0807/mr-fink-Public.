name: Refresh from SEC EDGAR

# EDGAR has no push notifications, so the site polls it: every 5 minutes (GitHub's shortest
# schedule; runs can start a few minutes late under load) the pipeline re-reads
# the managers' and companies' filing indexes and market quotes, rebuilds only what changed
# (everything else comes from the cache) and redeploys. The page polls data/status.json and
# data/quotes.json and updates in place; with a Finnhub key it streams real-time trades.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test_notification:
        description: Send a test push to the phone
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore EDGAR cache
        uses: actions/cache/restore@v4
        with:
          path: .cache
          key: edgar-${{ github.run_id }}
          restore-keys: edgar-
      - name: Unit tests
        run: python -m unittest discover -s tests -t .
      - name: Build data from EDGAR
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT || 'Mr Fink nissim711@gmail.com' }}
          MRFINK_SUBMISSIONS_TTL: "0"
          # Phone pushes via ntfy: the topic is a repository secret, never written to the site.
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TEST: ${{ inputs.test_notification }}
        run: python -m pipeline.build
      - name: Price feed config
        # Optional: a free Finnhub key turns on real-time prices (websocket trades) in the browser.
        # Without it the page shows Yahoo Finance quotes refreshed by this workflow.
        env:
          FINNHUB_KEY: ${{ vars.FINNHUB_KEY }}
        run: |
          python -c "import json, os; json.dump({'finnhubKey': os.environ.get('FINNHUB_KEY') or None}, open('web/data/config.json', 'w'))"
      - name: Decide whether to save the cache
        if: always()
        # Saving ~hundreds of MB every 5 minutes churns the 10 GB cache limit; once an hour is enough
        # (the notification state is published with the site, not kept only here).
        id: hourly
        run: echo "save=$([ "$(date -u +%M)" -lt 5 ] || [ "${{ github.event_name }}" != "schedule" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Save EDGAR cache
        # Also after a failed or timed-out build, so a slow first run (OpenFIGI mapping thousands of
        # new CUSIPs) is not repeated from scratch by every later run.
        if: always() && steps.hourly.outputs.save == 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache
          key: edgar-${{ github.run_id }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
