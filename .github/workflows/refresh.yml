name: Refresh from SEC EDGAR

# EDGAR has no push notifications, so the site polls it: every 5 minutes (GitHub's shortest
# schedule; runs can start a few minutes late under load) the pipeline re-reads
# the managers' and companies' filing indexes and market quotes, rebuilds only what changed
# (everything else comes from the cache) and redeploys. The page polls data/status.json and
# data/quotes.json and updates in place; with a Finnhub key it streams real-time trades.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    outputs:
      checked_at: ${{ steps.stamp.outputs.checked_at }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore EDGAR cache
        uses: actions/cache/restore@v4
        with:
          path: .cache
          key: edgar-${{ github.run_id }}
          restore-keys: edgar-
      - name: Unit tests
        run: python -m unittest discover -s tests -t .
      - name: Build data from EDGAR
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT || 'Mr Fink nissim711@gmail.com' }}
          MRFINK_SUBMISSIONS_TTL: "0"
        run: python -m pipeline.build
      - name: Price feed and push server config
        # Optional: a free Finnhub key turns on real-time prices (websocket trades) in the browser.
        # Without it the page shows Yahoo Finance quotes refreshed by this workflow.
        # The push server's address comes from the Cloudflare account (only the public URL is written).
        env:
          FINNHUB_KEY: ${{ vars.FINNHUB_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          sub=""
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            sub=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | jq -r '.result.subdomain // empty')
          fi
          PUSH_URL=$([ -n "$sub" ] && echo "https://mrfink-push.$sub.workers.dev" || echo "") \
            python -c "import json, os; json.dump({'finnhubKey': os.environ.get('FINNHUB_KEY') or None, 'pushUrl': os.environ.get('PUSH_URL') or None}, open('web/data/config.json', 'w'))"
      - name: Decide whether to save the cache
        if: always()
        # Saving ~hundreds of MB every 5 minutes churns the 10 GB cache limit; once an hour is enough
        # (the notification state is published with the site, not kept only here).
        id: hourly
        # Runs come every 5 minutes from cron-job.org (workflow_dispatch) or GitHub's schedule; a
        # push to main (new code) always saves.
        run: echo "save=$([ "$(date -u +%M)" -lt 5 ] || [ "${{ github.event_name }}" = "push" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Save EDGAR cache
        # Also after a failed or timed-out build, so a slow first run (OpenFIGI mapping thousands of
        # new CUSIPs) is not repeated from scratch by every later run.
        if: always() && steps.hourly.outputs.save == 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache
          key: edgar-${{ github.run_id }}
      - name: Stamp of this build
        id: stamp
        run: echo "checked_at=$(jq -r .checkedAt web/data/status.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  # GitHub Pages sometimes answers a deployment with a server error, and sometimes reports it as
  # successful while the site keeps serving an older version. So every deployment is checked
  # against the live site, retried once, and the run fails (visibly) if the site is still stale.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      SITE: ${{ vars.SITE_URL || 'https://ngean0807.github.io/mr-fink-Public./' }}
      BUILT: ${{ needs.build.outputs.checked_at }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Check the live site serves this build
        id: check1
        continue-on-error: true
        run: .github/scripts/verify-live.sh
      - name: Deploy again
        id: deployment2
        if: steps.deployment.outcome == 'failure' || steps.check1.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Check again
        if: steps.deployment.outcome == 'failure' || steps.check1.outcome == 'failure'
        run: .github/scripts/verify-live.sh
