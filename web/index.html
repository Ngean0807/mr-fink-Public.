<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TriQ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto:wght@400;500&family=Archivo:wght@800&display=swap">
<link rel="stylesheet" href="styles.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1a73e8">
<link rel="icon" href="icons/logo.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TriQ">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="#big3" aria-label="TriQ home">
      <img class="brand-mark" src="icons/logo.svg" alt="" width="34" height="34">
      <span class="brand-name"><b class="wm" translate="no" dir="ltr">TRI<i>Q</i></b> <span>Holdings</span></span>
    </a>
    <div class="search" role="search">
      <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      <label class="sr" for="q">Search holdings</label>
      <input id="q" type="search" placeholder="Search holdings by ticker or company" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="suggest">
      <div class="suggest" id="suggest" role="listbox" hidden></div>
    </div>
    <div class="top-actions">
      <span class="live" id="live" aria-live="polite"><span class="dot"></span><span id="live-text">Loading</span></span>
      <button type="button" class="bell" id="bell" aria-haspopup="dialog" aria-expanded="false" aria-controls="npanel" title="Notifications">
        <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.89 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>
        <span class="sr">Notifications</span><span class="bell-count" id="bell-count" hidden></span>
      </button>
    </div>
  </div>
</header>
<nav class="chipbar" aria-label="Managers"><div class="chipbar-inner" id="chips"></div></nav>
<div class="tapebar" aria-label="Largest holdings, live prices"><div class="tape" id="tape"></div></div>

<main class="page" id="app"></main>
<nav class="tabbar" id="tabbar" aria-label="Sections">
  <a href="#big3" data-tb="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 13h2v7H3zm4-6h2v13H7zm4 3h2v10h-2zm4-6h2v16h-2zm4 9h2v7h-2z"/></svg><span>Holdings</span></a>
  <a href="#analytics" data-tb="analytics"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 2v20c-5.07-.5-9-4.79-9-10s3.93-9.5 9-10zm2.03 0v8.99H22c-.47-4.74-4.24-8.52-8.97-8.99zm0 11.01V22c4.74-.47 8.5-4.25 8.97-8.99h-8.97z"/></svg><span>Analytics</span></a>
  <a href="#emerging" data-tb="emerging"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 6l2.29 2.29-4.88 4.88-4-4L2 16.59 3.41 18l6-6 4 4 6.3-6.29L22 12V6z"/></svg><span>Emerging</span></a>
  <a href="#etfs" data-tb="etfs"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h7v7H4zm9 0h7v7h-7zM4 13h7v7H4zm9 0h7v7h-7z"/></svg><span>ETFs</span></a>
  <a href="#watchlist" data-tb="watch"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg><span>Watchlist</span></a>
</nav>

<div class="tip" id="tip" role="tooltip" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>
<div class="npanel" id="npanel" role="dialog" aria-labelledby="np-h" hidden></div>

<script src="i18n-he.js"></script>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
